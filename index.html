<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eclipse - RPG de ação online</title>
<style>
html,body{margin:0;height:100%;background:#0c0b0f;color:#e8e2d2;font:16px system-ui,sans-serif}
#m{text-align:center;padding:20vh 16px}h1{color:#d9b45f;letter-spacing:.3em}
iframe{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c0b0f}
</style></head>
<body><div id="m"><h1>ECLIPSE</h1><p id="t">Abrindo o site...</p></div>
<iframe id="f" title="Eclipse" allow="clipboard-write"></iframe>
<script>
var API='https://api.github.com/repos/maarllon-arch/eclipse/contents/atual.txt';
function fail(){document.getElementById('t').textContent='O servidor esta desligado no momento. Tente de novo mais tarde.';}
function go(u){u=(u||'').trim().replace(/\/$/,'');
  if(!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u)){fail();return;}
  var f=document.getElementById('f');f.src=u+'/';f.style.display='block';document.getElementById('m').style.display='none';}
fetch(API,{headers:{Accept:'application/vnd.github.raw'},cache:'no-store'}).then(function(r){return r.text();}).then(go)
.catch(function(){fetch('atual.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(go).catch(fail);});
</script></body></html>
